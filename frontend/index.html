<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindSpring — Semantic Search for Conversations</title>
  <meta name="description" content="Semantic search engine for AI conversation exports. Upload, search, and explore your conversations with vector-powered intelligence.">
  <meta name="theme-color" content="#0F0F0F">

  <!-- Favicon (inline SVG data URI) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' stroke='%23CE9D73' stroke-width='1.5' fill='none'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23A86CFB' opacity='0.8'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%23E8E0D6'/%3E%3C/svg%3E">

  <!-- Open Graph -->
  <meta property="og:title" content="MindSpring">
  <meta property="og:description" content="Semantic search engine for AI conversation exports">
  <meta property="og:type" content="website">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- ═══════════════════════════════════════════
       APP HEADER
       ═══════════════════════════════════════════ -->
  <header class="app-header">
    <div class="header-left">
      <div class="app-logo" aria-label="MindSpring">
        <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
          <circle cx="16" cy="16" r="14" stroke="#CE9D73" stroke-width="1.5"/>
          <circle cx="16" cy="16" r="6" fill="#A86CFB" opacity="0.8"/>
          <circle cx="16" cy="16" r="2" fill="#E8E0D6"/>
          <line x1="16" y1="2" x2="16" y2="10" stroke="#26C6DA" stroke-width="1" opacity="0.5"/>
          <line x1="16" y1="22" x2="16" y2="30" stroke="#26C6DA" stroke-width="1" opacity="0.5"/>
          <line x1="2" y1="16" x2="10" y2="16" stroke="#26C6DA" stroke-width="1" opacity="0.5"/>
          <line x1="22" y1="16" x2="30" y2="16" stroke="#26C6DA" stroke-width="1" opacity="0.5"/>
        </svg>
        <span class="logo-text">MindSpring</span>
      </div>
    </div>

    <nav class="app-nav" aria-label="Main navigation">
      <button class="nav-btn active" data-page="search" aria-label="Search conversations">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
        </svg>
        <span>Search</span>
      </button>
      <button class="nav-btn" data-page="chat" aria-label="Chat with your history">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <span>Chat</span>
      </button>
      <button class="nav-btn" data-page="upload" aria-label="Upload conversations">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <span>Upload</span>
      </button>
      <button class="nav-btn" data-page="settings" aria-label="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
        <span>Settings</span>
      </button>
    </nav>

    <div class="header-right">
      <kbd class="shortcut-hint" title="Press / to search">/</kbd>
    </div>
  </header>

  <!-- ═══════════════════════════════════════════
       MAIN CONTENT
       ═══════════════════════════════════════════ -->
  <main id="app-main" class="app-main"></main>

  <!-- Toast container injected by JS -->

  <script src="app.js"></script>
</body>
</html>
