name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run type-check

      - name: Test
        run: npm test

  smoke-v2-live:
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ secrets.MINDSPRING_BASE_URL != '' && secrets.MINDSPRING_API_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Run v2 smoke against deployed worker
        env:
          MINDSPRING_BASE_URL: ${{ secrets.MINDSPRING_BASE_URL }}
          MINDSPRING_API_KEY: ${{ secrets.MINDSPRING_API_KEY }}
        run: npm run smoke:v2
